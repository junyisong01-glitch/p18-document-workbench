name: P18 Chinese Documents Package
on:
  push:
    branches:
      - p18-test-documents-20261020
    paths:
      - 'P18 中文技术文档（第二批）/**'
      - '.github/workflows/p18-chinese-documents-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CJK TrueType font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          find /usr/share/fonts -iname '*gbsn*'
      - name: Install converter libraries
        run: python -m pip install --disable-pip-version-check python-docx reportlab
      - name: Make DOCX and PDF reading versions
        run: python 'P18 中文技术文档（第二批）/00_说明与题库/生成PDF和Word.py'
      - name: Validate and package
        run: |
          python - <<'PY'
          import csv,zipfile
          from pathlib import Path
          root=Path("P18 中文技术文档（第二批）")
          with (root/"00_说明与题库"/"原始来源.csv").open(encoding="utf-8") as f: rows=list(csv.DictReader(f))
          assert len(rows)==13
          for r in rows:
              base=root/r["类别"]/(r["标题"]+"_阅读版")
              for ext in (".docx",".pdf"):
                  p=base.with_suffix(ext)
                  assert p.is_file() and p.stat().st_size>1000,p
                  if ext==".docx":
                      with zipfile.ZipFile(p) as z: assert z.testzip() is None
                  else:assert p.read_bytes()[:5]==b"%PDF-"
          out=Path("P18-Chinese-technical-documents.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and not p.is_symlink():z.write(p,p.as_posix())
          with zipfile.ZipFile(out) as z:assert z.testzip() is None;print(len(z.namelist()),"files in ZIP")
          PY
      - name: Upload ZIP for download
        uses: actions/upload-artifact@v4
        with:
          name: P18-Chinese-technical-documents
          path: P18-Chinese-technical-documents.zip
          retention-days: 14

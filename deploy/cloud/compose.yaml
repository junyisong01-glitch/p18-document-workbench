name: p18-enterprise-demo
x-runtime: &runtime
  build:
    context: ../..
    dockerfile: deploy/cloud/Dockerfile
  network_mode: host
  volumes:
    - ../../runtime:/app/runtime
    - models:/app/.cache/huggingface
  environment: &env
    P18_DATA_DIR: /app/runtime/demo-v1-experience
    P18_CLOUD_DEMO: "1"
    P18_PUBLIC_ORIGIN: https://${P18_DOMAIN:?Set P18_DOMAIN in deploy/cloud/.env}
    LLM_PROVIDER: ollama
    OLLAMA_MODEL: qwen3.5:4b
    OLLAMA_NUM_CTX: "16384"
    P18_DEEPSEEK_TIMEOUT: "120"
    P18_SEMANTIC_ENABLED: "1"
    P18_SEARCH_MODE: hybrid_dedup
    P18_SEARCH_CANDIDATES: "20"
    P18_SEARCH_TOP_K: "5"
    P18_CHUNK_TARGET: "500"
    P18_CHUNK_OVERLAP: "50"
    P18_EMBEDDING_REVISION: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    P18_EMBEDDING_DIMENSION: "1024"
    P18_EMBEDDING_MAX_TOKENS: "4096"
    HF_HUB_CACHE: /app/.cache/huggingface/hub
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    TOKENIZERS_PARALLELISM: "false"
    P18_PARSER: docling
    P18_DOCX_PYTHON: /usr/local/bin/python
    P18_DOCLING_FALLBACK: legacy
    P18_SQLITE_WAL: "1"
    SOFFICE_PATH: /usr/bin/soffice
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    HOME: /app/.local-home
    TMPDIR: /app/runtime/tmp
    XDG_CACHE_HOME: /app/.cache
    XDG_CONFIG_HOME: /app/.local-config
    XDG_DATA_HOME: /app/.local-share
    PYTHONPATH: /app/config/experience_guard:/app
    NO_PROXY: "*"
    no_proxy: "*"
services:
  prepare-model:
    <<: *runtime
    restart: "no"
    environment:
      <<: *env
      PYTHONPATH: /app
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    command: [python, deploy/cloud/prepare_model.py]
  ollama:
    image: ollama/ollama:0.40.2
    network_mode: host
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes: ["ollama:/root/.ollama"]
  app:
    <<: *runtime
    restart: unless-stopped
    depends_on:
      prepare-model:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8896/__health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  https:
    image: caddy:2.10.2
    network_mode: host
    restart: unless-stopped
    environment:
      P18_DOMAIN: ${P18_DOMAIN:?Set P18_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  models:
  ollama:
  caddy_data:
  caddy_config:
